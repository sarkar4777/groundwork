<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Groundwork, an autonomous construction site run by Abenix">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04122b"/>
      <stop offset="0.6" stop-color="#0a2a5e"/>
      <stop offset="1" stop-color="#0d3b7a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#78b4ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="28" fill="url(#bbg)"/>
  <rect width="1280" height="320" rx="28" fill="url(#grid)"/>
  <path d="M640 300 C 800 262, 940 306, 1090 276 S 1240 250, 1300 262" fill="none" stroke="#5cc8ff" stroke-opacity="0.35" stroke-width="4"/>
  <path d="M600 320 C 780 290, 930 330, 1100 304 S 1250 286, 1300 292" fill="none" stroke="#5cc8ff" stroke-opacity="0.18" stroke-width="3"/>
  <g transform="translate(64 56) scale(0.40625)">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3b7a"/>
      <stop offset="0.55" stop-color="#0a2a5e"/>
      <stop offset="1" stop-color="#04122b"/>
    </linearGradient>
    <radialGradient id="lglow" cx="0.72" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#5cc8ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ltile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#ltile)">
    <rect width="512" height="512" fill="url(#lbg)"/>
    <rect width="512" height="512" fill="url(#lglow)"/>
    <!-- survey contours, the ground seen from the drone -->
    <path d="M-20 392 C 80 352, 170 410, 270 378 S 450 330, 540 362" fill="none" stroke="#5cc8ff" stroke-opacity="0.9" stroke-width="10" stroke-linecap="round"/>
    <path d="M-20 432 C 90 398, 190 452, 300 420 S 460 380, 540 404" fill="none" stroke="#5cc8ff" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round"/>
    <path d="M-20 470 C 100 440, 210 490, 320 462 S 470 426, 540 446" fill="none" stroke="#5cc8ff" stroke-opacity="0.3" stroke-width="6" stroke-linecap="round"/>
    <!-- tower crane -->
    <g stroke="#e8f6ff" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M184 380 V 150 M222 380 V 150" stroke-width="10"/>
      <path d="M184 372 L 222 334 L 184 296 L 222 258 L 184 220 L 222 182 L 184 150" stroke-width="6" stroke-opacity="0.8"/>
      <path d="M112 150 H 424" stroke-width="16"/>
      <path d="M203 150 V 92 M203 92 L 124 150 M203 92 L 400 150" stroke-width="6" stroke-opacity="0.85"/>
      <path d="M166 380 H 240" stroke-width="12"/>
    </g>
    <rect x="114" y="158" width="48" height="34" rx="6" fill="#c9ecff"/>
    <!-- hook and load -->
    <path d="M352 158 V 262" stroke="#ffb020" stroke-width="6" stroke-linecap="round"/>
    <rect x="322" y="262" width="60" height="40" rx="7" fill="#ffb020"/>
    <rect x="322" y="262" width="60" height="12" rx="6" fill="#ffd27a"/>
    <circle cx="352" cy="158" r="9" fill="#ffb020"/>
    <!-- live dot -->
    <circle cx="420" cy="92" r="16" fill="#3ee6a8"/>
    <circle cx="420" cy="92" r="28" fill="none" stroke="#3ee6a8" stroke-opacity="0.45" stroke-width="5"/>
  </g>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#78b4ff" stroke-opacity="0.25" stroke-width="4"/>
</g>
  <text x="312" y="168" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="#eaf6ff" letter-spacing="-2">Groundwork</text>
  <text x="316" y="222" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#5cc8ff">An autonomous construction site, run by Abenix</text>
  <text x="316" y="262" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" fill="#c9ecff" fill-opacity="0.7">45 vECUs · J1939 + Sparkplug B · 9 agents · 6 ML models · live</text>
  <rect x="1.5" y="1.5" width="1277" height="317" rx="27" fill="none" stroke="#78b4ff" stroke-opacity="0.22" stroke-width="3"/>
</svg>
